<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071521"><title>AS-3 · PS3 XMB</title>
<style>
:root{color-scheme:dark;--glow:#bcecff;--muted:#b3c8d5}*{box-sizing:border-box}body{margin:0;overflow:hidden;height:100vh;background:radial-gradient(ellipse at 70% 20%,#1c6682 0,transparent 40%),linear-gradient(130deg,#07131f,#17445a 60%,#07111d);color:#f5fbff;font:16px Arial,sans-serif}body:before,body:after{content:"";position:fixed;inset:-35%;border:1px solid #bcecff26;border-radius:45%;transform:rotate(-18deg);animation:wave 20s ease-in-out infinite;pointer-events:none}body:after{inset:-45%;animation-duration:29s;border-color:#bcecff18}@keyframes wave{50%{transform:rotate(18deg) translate(3%,2%) scale(1.08)}}header{position:absolute;top:5%;left:6%;right:6%;display:flex;justify-content:space-between;color:#d8f4ff;text-shadow:0 1px 8px #0008}.brand{font-size:13px;letter-spacing:5px;opacity:.8}.clock{font-size:14px}.bar{position:absolute;top:31%;left:7%;right:7%;display:flex;align-items:center;gap:25px;min-height:66px}.cat{font-size:38px;opacity:.55;cursor:pointer;transition:.25s;white-space:nowrap}.cat.active{opacity:1;color:white;text-shadow:0 0 16px #a9eeff;transform:scale(1.18)}.cat small{display:block;font-size:10px;letter-spacing:2px;text-align:center;margin-top:8px}.panel{position:absolute;top:44%;left:12%;width:min(470px,76vw);max-height:48vh;overflow:auto;background:#06152152;border:1px solid #d8f5ff33;border-radius:5px;backdrop-filter:blur(8px);padding:12px 18px;box-shadow:0 15px 55px #0003}.item{padding:12px 14px;border-bottom:1px solid #dff7ff17;color:#d9eaf2;cursor:pointer}.item:hover,.item.selected{background:#bdeeff25;color:white;text-shadow:0 0 9px #bdeeff}.hint{position:absolute;bottom:5%;left:6%;font-size:12px;color:#d3e9f3a8}.status{position:absolute;bottom:5%;right:6%;font-size:12px;color:#d3e9f3a8}.view{position:absolute;inset:0;background:#061521eF;z-index:5;padding:8vh 8vw;display:none;overflow:auto}.view.show{display:block}.view h1{font-weight:300;letter-spacing:3px}.view button,.view select,.view input{background:#17394b;color:white;border:1px solid #8edfff66;padding:10px;margin:5px;border-radius:4px}.view button{cursor:pointer}.preview{max-width:75vw;max-height:55vh;display:block;margin-top:15px}.close{position:fixed;top:4vh;right:5vw}.muted{color:var(--muted);font-size:13px}
</style></head>
<body>
<header><div><div class="brand">AS-3 ENTERTAINMENT SYSTEM</div><div style="margin-top:10px;font-size:13px">XrossMediaBar</div></div><div class="clock" id="clock"></div></header>
<nav class="bar" id="bar"></nav><section class="panel" id="panel"></section>
<div class="hint">↑ ↓ Navigate　　← → Categories　　ENTER Select　　ESC Back</div><div class="status" id="status">SYSTEM READY · FW 4.91</div>
<section class="view" id="view"><button class="close" onclick="closeView()">✕ CLOSE</button><div id="viewContent"></div></section>
<script>
const categories=[
{name:"Users",icon:"♙",items:["Create New User","Switch User","Delete User"]},
{name:"Settings",icon:"⚙",items:["System Update","System Settings","Display Settings","Sound Settings","Network Settings","Date and Time Settings","Accessory Settings","Printer Settings","System Information","Restore Default Settings"]},
{name:"Photo",icon:"▧",items:["All Photos","Import from USB Device","Slideshow"]},
{name:"Music",icon:"♫",items:["All Music","Import from USB Device","Audio CD"]},
{name:"Video",icon:"▣",items:["All Video","Import from USB Device","Search for Media Servers"]},
{name:"Game",icon:"♧",items:["Neon Runner","Orb Catcher","Game Data Utility","Saved Data Utility"]},
{name:"Network",icon:"◎",items:["Internet Browser","PlayStation Network","Network Status"]},
{name:"Friends",icon:"♧",items:["Friends List","Message Box"]}
];
let ci=0,ii=0,users=JSON.parse(localStorage.as3users||'["User 1"]'),activeUser=localStorage.as3active||users[0],files={Photo:[],Music:[],Video:[]};
const $=s=>document.querySelector(s);
function render(){ $('#bar').innerHTML=categories.map((c,i)=>'<div class="cat '+(i===ci?'active':'')+'" data-i="'+i+'">'+c.icon+'<small>'+c.name.toUpperCase()+'</small></div>').join('');$('#bar').querySelectorAll('.cat').forEach(el=>el.onclick=()=>{ci=+el.dataset.i;ii=0;render()});let c=categories[ci];$('#panel').innerHTML=c.items.map((v,i)=>'<div class="item '+(i===ii?'selected':'')+'" data-i="'+i+'">'+v+'</div>').join('');$('#panel').querySelectorAll('.item').forEach(el=>el.onclick=()=>{ii=+el.dataset.i;render();select()});$('#status').textContent='SIGNED IN AS '+activeUser.toUpperCase()+' · FW 4.91'}
function tick(){let d=new Date();$('#clock').textContent=d.toLocaleDateString(undefined,{weekday:'short',day:'2-digit',month:'short'})+'  '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}setInterval(tick,1000);tick();render();
function openView(title,html){$('#viewContent').innerHTML='<h1>'+title+'</h1>'+html;$('#view').classList.add('show')}
function closeView(){ $('#view').classList.remove('show');render() }
function select(){let c=categories[ci].name,item=categories[ci].items[ii];if(c==='Users')return userAction(item);if(['Photo','Music','Video'].includes(c))return mediaAction(c,item);if(c==='Settings')return settingsAction(item);if(c==='Game')return gameAction(item);if(c==='Network')return networkAction(item);if(c==='Friends')return openView(item,'<p class="muted">No online friends are available in this local simulation.</p>');}
function userAction(item){if(item.startsWith('Create')){let n=prompt('New user name:');if(n){users.push(n);localStorage.as3users=JSON.stringify(users);activeUser=n;localStorage.as3active=n;render()}}else if(item.startsWith('Switch')){let n=prompt('Choose user:\n'+users.join('\n'));if(users.includes(n)){activeUser=n;localStorage.as3active=n;render()}}else{let n=prompt('Enter user to delete:\n'+users.join('\n'));if(users.length>1&&users.includes(n)){users=users.filter(x=>x!==n);if(activeUser===n)activeUser=users[0];localStorage.as3users=JSON.stringify(users);localStorage.as3active=activeUser;render()}}}
function settingsAction(item){let html='';if(item==='System Information')html='<p>System Software: Version 4.91</p><p>System Name: AS-3</p><p>Storage: Browser local storage</p><p>Hardware: Web-based PS3 XMB simulation</p>';else if(item==='Network Settings')html='<p>Internet Connection: <b id="wifi">Enabled (simulated)</b></p><button onclick="document.getElementById(\'wifi\').textContent=document.getElementById(\'wifi\').textContent.startsWith(\'Enabled\')?\'Disabled\':\'Enabled (simulated)\'">Toggle connection</button>';else if(item==='Display Settings')html='<label>Resolution <select><option>1920 × 1080</option><option>1280 × 720</option><option>3840 × 2160</option></select></label>';else if(item==='Sound Settings')html='<label>Master volume <input type="range" min="0" max="100" value="75"></label><button onclick="new AudioContext().resume()">Test audio</button>';else html='<p>'+item+' is simulated in this browser interface.</p>';openView(item,html)}
function mediaAction(type,item){let html='<p>Select local files from your device. Files stay in this browser session.</p><input id="upload" type="file" '+(type==='Photo'?'accept="image/*"':type==='Music'?'accept="audio/*"':'accept="video/*"')+' multiple><div id="mediaList"></div><div id="preview"></div>';openView(item,html);$('#upload').onchange=e=>{let list=[...e.target.files];$('#mediaList').innerHTML=list.map((f,i)=>'<p>'+f.name+'</p>').join('');if(list[0]){let url=URL.createObjectURL(list[0]);$('#preview').innerHTML=type==='Photo'?'<img class="preview" src="'+url+'">':type==='Video'?'<video class="preview" controls src="'+url+'"></video>':'<audio controls src="'+url+'"></audio>'}}}
function networkAction(item){if(item==='Internet Browser')openView(item,'<p>This is a simulated browser shortcut.</p><input id="url" placeholder="https://example.com" style="width:min(500px,80%)"><button onclick="window.open(document.getElementById(\'url\').value,\'_blank\')">Open website</button>');else openView(item,'<p>PlayStation Network: Not connected (simulation only).</p><p>Network status: Local browser interface online.</p>')}
function gameAction(item){if(item==='Neon Runner')return miniGame('NEON RUNNER','Dodge the falling blocks. Use ← → or A / D.');if(item==='Orb Catcher')return miniGame('ORB CATCHER','Move with ← → and catch the falling orbs.');openView(item,'<p>Local game data simulation.</p>')}
function miniGame(name,desc){openView(name,'<p>'+desc+'</p><canvas id="game" width="640" height="360" style="width:min(100%,640px);background:#07121f;border:1px solid #8deaff66"></canvas><p id="score">Score: 0</p>');let cv=$('#game'),ctx=cv.getContext('2d'),x=300,y=320,ob={x:Math.random()*600,y:0},score=0,dir=0;let key=e=>{if(e.key==='ArrowLeft'||e.key==='a')dir=-1;if(e.key==='ArrowRight'||e.key==='d')dir=1};window.addEventListener('keydown',key);let loop=setInterval(()=>{ctx.clearRect(0,0,640,360);x=Math.max(0,Math.min(600,x+dir*7));ob.y+=4;ctx.fillStyle='#9cecff';ctx.fillRect(x,330,40,18);ctx.fillStyle='#ff6b9d';ctx.fillRect(ob.x,ob.y,30,30);if(ob.y>360){ob={x:Math.random()*600,y:-30};score++;$('#score').textContent='Score: '+score}if(ob.y>310&&ob.x<x+40&&ob.x+30>x){clearInterval(loop);window.removeEventListener('keydown',key);$('#score').textContent='Game over · Score: '+score}},30);$('#view').dataset.game='1'}
function back(){if($('#view').classList.contains('show')){closeView();return}ci=Math.max(0,ci-1);ii=0;render()}
document.addEventListener('keydown',e=>{if($('#view').classList.contains('show')){if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();closeView()}return}if(e.key==='ArrowRight'){ci=(ci+1)%categories.length;ii=0;render()}if(e.key==='ArrowLeft'){ci=(ci+categories.length-1)%categories.length;ii=0;render()}if(e.key==='ArrowDown'){ii=(ii+1)%categories[ci].items.length;render()}if(e.key==='ArrowUp'){ii=(ii+categories[ci].items.length-1)%categories[ci].items.length;render()}if(e.key==='Enter')select();if(e.key==='Escape'||e.key==='Backspace')back()});
</script></body></html>
